plugins {
    id 'com.android.library'
}

android {
    namespace 'com.udokw.knightlan'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Godot 运行时由宿主 APK 提供，插件只编译不打包
    compileOnly files('../KnightUpdate/libs/godot-lib.template_release.aar')
}
