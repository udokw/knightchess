name: Build Mobile (iOS IPA + Android APK)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  VERSION_NAME: "1.0.2"
  VERSION_CODE: "3"
  GODOT_VERSION: "4.3-stable"
  GODOT_TEMPLATE_DIR: "4.3.stable"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK 与 build-tools
        run: |
          set -euo pipefail
          # 使用 runner 预装的 SDK；android-actions/setup-android 会调用已下线的 "tools" 包而失败
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          test -x "$SDKMANAGER" || { echo "未找到 sdkmanager"; ls -R "$ANDROID_SDK_ROOT" | head -40; exit 1; }
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;23.2.8568313" > /dev/null
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: 下载 Godot 与导出模板
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot_templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          godot --headless --version
          ls "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}" | head -20

      - name: 生成 debug keystore
        run: |
          set -euo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/android_debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          ls -l "$HOME/android_debug.keystore"

      - name: 写入 Godot 编辑器设置
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/android_debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: 校验版本号一致
        run: |
          python3 - <<'PY'
          import re
          s = open("export_presets.cfg", encoding="utf-8-sig").read()
          ios_ver = re.search(r'application/short_version="([^"]+)"', s).group(1)
          ios_build = re.search(r'application/version="([^"]+)"', s).group(1)
          and_ver = re.search(r'version/name="([^"]+)"', s).group(1)
          and_code = re.search(r'version/code=(\d+)', s).group(1)
          assert (ios_ver, ios_build) == (and_ver, and_code), (ios_ver, ios_build, and_ver, and_code)
          pg = open("project.godot", encoding="utf-8-sig").read()
          proj_ver = re.search(r'config/version="([^"]+)"', pg).group(1)
          import os
          env_ver = os.environ["VERSION_NAME"]
          assert proj_ver == and_ver == env_ver, (proj_ver, and_ver, env_ver)
          print("project.godot / presets / workflow 版本一致:", proj_ver, and_ver, env_ver)
          PY

      - name: 安装 Android 构建模板（Gradle 构建必需）
        run: |
          set -euo pipefail
          TEMPLATE_ZIP="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_source.zip"
          rm -rf android/build
          mkdir -p android/build
          unzip -q "$TEMPLATE_ZIP" -d android/build
          touch android/build/.gdignore
          printf '%s\n' "${GODOT_TEMPLATE_DIR}" > android/.build_version
          test -f android/build/build.gradle || { echo "构建模板不完整"; ls -R android/build | head -40; exit 1; }
          test -f android/build/libs/release/godot-lib.template_release.aar || { echo "缺少 godot-lib"; ls -lh android/build/libs/release/ || true; exit 1; }
          ls -lh android/build/libs/release/
          echo "--- 构建模板版本 ---"; cat android/.build_version

      - name: 导入资源并导出 APK
        run: |
          set -euo pipefail
          godot --headless --path . --import || true
          godot --headless --path . --import
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/KnightChess.apk
          ls -lh build/KnightChess.apk

      - name: 校验 APK 签名与包信息
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | head -1)
          "$APKSIGNER" verify --print-certs build/KnightChess.apk
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt | head -1)
          "$AAPT" dump badging build/KnightChess.apk | head -3
          "$AAPT" dump badging build/KnightChess.apk | grep -q "versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" \
            || { echo "APK 版本号与 workflow 不一致"; exit 1; }
          "$AAPT" dump badging build/KnightChess.apk | grep -q "REQUEST_INSTALL_PACKAGES" \
            || { echo "缺少 REQUEST_INSTALL_PACKAGES"; exit 1; }
          "$AAPT" dump xmltree build/KnightChess.apk AndroidManifest.xml | grep -q "org.godotengine.plugin.v2.KnightUpdate" \
            || { echo "KnightUpdate 插件未注册"; exit 1; }
          echo "APK 版本与插件校验通过"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: KnightChess3-android-apk
          path: build/KnightChess.apk
          if-no-files-found: error

  ios:
    name: iOS Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Godot 与 iOS 导出模板
        run: |
          set -euo pipefail
          GODOT=/Applications/Godot.app/Contents/MacOS/Godot
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          sudo mv Godot.app /Applications/
          sudo xattr -dr com.apple.quarantine /Applications/Godot.app || true

          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          mv /tmp/godot_templates/templates "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          "$GODOT" --headless --version
          ls "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}" | head -20

      - name: 校验版本号一致
        run: |
          python3 - <<'PY'
          import re
          s = open("export_presets.cfg", encoding="utf-8-sig").read()
          ios_ver = re.search(r'application/short_version="([^"]+)"', s).group(1)
          ios_build = re.search(r'application/version="([^"]+)"', s).group(1)
          and_ver = re.search(r'version/name="([^"]+)"', s).group(1)
          and_code = re.search(r'version/code=(\d+)', s).group(1)
          assert (ios_ver, ios_build) == (and_ver, and_code), (ios_ver, ios_build, and_ver, and_code)
          pg = open("project.godot", encoding="utf-8-sig").read()
          proj_ver = re.search(r'config/version="([^"]+)"', pg).group(1)
          import os
          env_ver = os.environ["VERSION_NAME"]
          assert proj_ver == and_ver == env_ver, (proj_ver, and_ver, env_ver)
          print("project.godot / presets / workflow 版本一致:", proj_ver, and_ver, env_ver)
          PY

      - name: 导入资源
        run: |
          set -euo pipefail
          GODOT=/Applications/Godot.app/Contents/MacOS/Godot
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import

      - name: 导出 Xcode 工程
        run: |
          set -euo pipefail
          GODOT=/Applications/Godot.app/Contents/MacOS/Godot
          mkdir -p build
          "$GODOT" --headless --path . --export-release "iOS" build/KnightChess.ipa
          echo "--- build 目录 ---"
          find build -maxdepth 3 -name "*.xcodeproj" -o -maxdepth 3 -name "*.pbxproj" | head -5
          PROJ=$(find build -name "*.xcodeproj" -maxdepth 4 | head -1)
          test -n "$PROJ" || { echo "未找到 xcodeproj"; ls -R build | head -50; exit 1; }
          xcodebuild -list -json -project "$PROJ"

      - name: 构建未签名 ipa
        run: |
          set -euo pipefail
          PROJ=$(find build -name "*.xcodeproj" -maxdepth 4 | head -1)
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "import json,sys; p=json.load(sys.stdin)['project']; print((p.get('schemes') or p['targets'])[0])")
          echo "project=$PROJ scheme=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/KnightChess.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
          APP=$(find build/KnightChess.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "归档里没有 .app"; find build/KnightChess.xcarchive -maxdepth 4; exit 1; }
          echo "app: $APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../KnightChess-unsigned.ipa Payload
          cd ..
          ls -lh KnightChess-unsigned.ipa
          unzip -l KnightChess-unsigned.ipa | head -5

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: KnightChess3-ios-ipa
          path: build/KnightChess-unsigned.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 打 tag 并发布安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find dist -type f -exec ls -lh {} \;
          APK=$(find dist -name "*.apk" | head -1)
          IPA=$(find dist -name "*.ipa" | head -1)
          test -n "$APK" -a -n "$IPA" || { echo "缺少安装包"; exit 1; }
          TAG="v${VERSION_NAME}"
          cat > notes.md <<'EOF'
          ## 骑士飞行棋3 v1.0.2

          ### 本次改动
          - 新增设置页「更新检查」开关（持久化）：进入设置时自动检查一次，发现新版本弹小对话框，不做全屏强制更新
          - 更新包从飞机盘分享目录读取：安卓读「安卓」、iOS 读「ios」，按「骑士飞行棋-版本号」取最大且大于当前版本的安装包
          - 安卓下载更新后调起系统安装器；iOS 用浏览器下载，文件落在「文件 → 下载」
          - 网络异常、目录为空或接口异常时给出可读提示，并提供「用浏览器打开分享页」兜底

          ### 安装包
          - `KnightChess-unsigned.ipa` — 未签名 IPA，需自签/侧载（AltStore、Sideloadly、TrollStore 等）
          - `KnightChess.apk` — debug 签名，可直接安装

          版本 1.0.2（build 3）
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$IPA" --clobber
          else
            gh release create "$TAG" "$APK" "$IPA" --target "$GITHUB_SHA" \
              --title "骑士飞行棋3 v${VERSION_NAME}" --notes-file notes.md
          fi
          echo "RELEASE_URL=$(gh release view "$TAG" --json url --jq .url)"
